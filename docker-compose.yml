services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agzs}
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: central-server/Dockerfile
    environment:
      CENTRAL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agzs}
      CENTRAL_BOOTSTRAP_USER: ${CENTRAL_BOOTSTRAP_USER:-}
      CENTRAL_BOOTSTRAP_PASSWORD: ${CENTRAL_BOOTSTRAP_PASSWORD:-}
      AGZS_BIND_HOST: 0.0.0.0
      AGZS_BIND_PORT: "8000"
    depends_on:
      - postgres
    expose:
      - "8000"
  nginx:
    image: nginx:1.27
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
