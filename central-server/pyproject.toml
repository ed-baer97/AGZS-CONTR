[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agzs-server"
version = "0.2.0"
description = "Центральный сервер AGZS Control. API начинается на этапе 8."
requires-python = ">=3.12"
dependencies = ["agzs-shared==0.2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agzs_server*"]
