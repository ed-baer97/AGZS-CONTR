[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agzs-server"
version = "0.3.0"
description = "Центральный сервер AGZS Control"
requires-python = ">=3.12"
dependencies = [
    "agzs-shared==0.2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
agzs-server = "agzs_server.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agzs_server*"]
