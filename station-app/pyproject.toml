[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agzs-station"
version = "0.3.0"
description = "Локальная касса AGZS Control"
requires-python = ">=3.12"
dependencies = [
    "agzs-shared==0.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
ui = ["PySide6>=6.8"]

[project.scripts]
agzs-station = "agzs_station.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agzs_station*"]
